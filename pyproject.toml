[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-building-federation"
version = "1.0.0"
description = "Peer-assisted encrypted storage simulation for smart building controllers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "cryptography>=44,<51",
    "httpx>=0.27,<1",
]

[project.scripts]
building-federation = "building_federation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
